[project]
name = "rogolabs-quarry"
version = "0.1.0"
description = "Local-first vulnerability hunter for open-source repos: sandboxed scanning, contained dynamic validation, draft disclosure advisories"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
quarry = "quarry.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quarry*"]

[tool.setuptools.package-data]
quarry = ["*.sql", "sandbox/*.sb", "web/templates/*.html", "web/static/*", "vulndb_seeds/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
